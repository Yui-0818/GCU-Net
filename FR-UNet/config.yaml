model:
  type: FR_UNet
  args:
    {}

loss:
  type: CE_DiceLoss
  args:
    {}

optimizer:
  type: Adam
  args:
    lr: 1e-4
    weight_decay: 1e-5

lr_scheduler:
  type: CosineAnnealingLR
  args:
    T_max: 100

epochs: 100
save_dir: saved/
val_per_epochs: 10
save_period: 10
tensorboard: true
amp: true
threshold: 0.55
tile_size: 512
tile_stride: 448
